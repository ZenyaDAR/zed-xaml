name = "XAML"
grammar = "xml"
path_suffixes = ["xaml"]
block_comment = ["<!-- ", " -->"]
autoclose_before = "<>/\"}"
brackets = [
  { start = "<", end = ">", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]
tab_size = 4
